<!DOCTYPE html>
<html>
<head>
    <style>
        .container {
            height: 2000px;
            padding-top: 50px;
            background-color: #E3E3E3;
        }

        .box {
            position: sticky;
            top: 50px;
            width: 100px;
            height: 100px;
            background-color: #FF5733;
            color: #FFFFFF;
            text-align: center;
            line-height: 100px;
            font-size: 16px;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <p>Lorem ipsum dolor sit amet, consectetur adipiscing elit.</p>
        <div class="box">Box (sticky)</div>
    </div>
</body>
</html>
