<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>HTML images</h1>

    <h2>Example</h2>
    <img src="./assets/images.jpg">

    <h2>Attributes</h2>

    <h3>The <code>alt</code> Attributes </h3>
    <img src="./assets/images.jpg" alt="Kız Kulesi">

    <h3>The <code>width</code> and <code>height</code> Attributes </h3>
    <img src="./assets/images.jpg" width="250" height="200">

    <h3>The <code>srcset</code>  Attributes </h3>
    <img src="./assets/images.jpg">

    <h3>The <code>loading</code>  Attributes </h3>
    <img src="./assets/images.jpg" loading="lazy">




</body>
</html>
